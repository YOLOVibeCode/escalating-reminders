name: CI

on:
  pull_request:
  push:
    branches: [develop, uat, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=@er/api
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # Reported, not blocking: ~1.7k findings predate CI. continue-on-error sits on the step,
  # so the job stays green (no permanent red X) while the step shows the failures.
  # Remove it once lint is clean.
  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=@er/api
      - run: npm run lint
        continue-on-error: true
